name: Pages

# The website (site/, issue #537) on GitHub Pages, with the download buttons pointing at the latest release's files.
# Publishing a release redeploys it; so does a change to the site or its scripts on main, or a run by hand. Nothing is
# committed: the site is assembled on the runner and deployed as a Pages artifact. A pull request that touches the site
# runs the same build without the deploy, so a change that breaks it shows up before it reaches main.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-*.mts"
      - "scripts/shots-lib.mts"
      - "app/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/site-*.mts"
      - "scripts/shots-lib.mts"
      - "app/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time, and a newer one waits instead of cancelling a deploy in flight. A pull request's build-only
# runs have their own group, where a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event's own commit is the tag's, which can be older than main: the site always comes from main
          # (or, run by hand, from the branch it was run on).
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies without running install scripts
        # As in ci.yml: the build of the page and the demo's recording need TypeScript and Playwright, and no install
        # script runs.
        run: npm ci --ignore-scripts
      - name: Read the latest published release
        # `gh release view` with no tag is GitHub's "latest" release: published, never a draft or a prerelease.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,url,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release/release.json"
          tag=$(jq -r .tagName "$RUNNER_TEMP/release/release.json")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
      - name: Write latest.json
        # Fails when a platform's asset is missing or matches twice, so a renamed asset can't break a button unnoticed.
        run: node scripts/site-latest.mts "$RUNNER_TEMP/release/release.json" "$RUNNER_TEMP/release/SHA256SUMS" --out "$RUNNER_TEMP/release/latest.json"
      - name: Generate the schema types
        # The demo's UI build typechecks against app/schema/types.d.mts, which is generated, not committed (as in ci.yml,
        # where `npm run typecheck` makes it first).
        run: npm run build:types
      - name: Record the live demo
        # The real page on the demo characters, recorded off a real server in headless Chrome (the runner's own), so the
        # demo is always this commit's app. It fails if the recording holds a machine path or a character not in the demo.
        run: node scripts/site-demo.mts --out "$RUNNER_TEMP/demo"
      - name: Assemble the site
        run: node scripts/site-build.mts --out _site --latest "$RUNNER_TEMP/release/latest.json" --demo "$RUNNER_TEMP/demo"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
