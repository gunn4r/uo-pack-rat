name: CI

# Pushes to main, and pull requests. A push to a PR branch is covered by its pull_request run; a
# `push` trigger on every branch ran the whole matrix a second time for each one.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run it supersedes. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stated rather than inherited. The repository default is read-only today, so this changes nothing
# now -- it is here so that raising that default later cannot silently hand a fork's pull request a
# write-scoped token. Nothing in this workflow needs to write anything.
permissions:
  contents: read

jobs:
  # The suite runs as separate jobs per OS (issue #338): the Node files in one, the Electron files in two shards, so a UI flake
  # never holds up the Node result and no job comes near its time limit (macOS runs its Electron files one at a time). Each
  # job writes its own test summary. The three "Test on <os>" jobs are the checks the main branch requires: each passes only
  # when every job above it passed.
  node:
    name: Node tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hang must fail, not sit for the six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies without running install scripts
        # See the same step in release.yml for why this is safe: the tree's only install script
        # belongs to electron-winstaller, which is Squirrel-only and lazily required, and neither
        # Electron's binary (fetched on first require) nor TypeScript's native compiler (platform
        # optionalDependencies) comes from an install script. The Electron smoke test in this job is
        # what proves it -- it launches a real Electron, so a missing binary would fail here.
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Compile every adapter's Python scripts
        # Globs adapters/*/packrat-*.py so a new adapter (adapters/razor-enhanced/ today) is
        # covered automatically -- nothing to edit here when one ships. shell: bash makes the glob
        # behave the same on windows-latest (whose default shell is pwsh, which doesn't expand
        # wildcard arguments to external commands the way bash does) as it already does on macOS
        # and Linux.
        shell: bash
        run: python -m py_compile adapters/*/packrat-*.py
      - name: Test
        run: npm test -- --only-node
      - name: Upload the test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summary-node-${{ matrix.os }}
          path: test_logs/latest_summary.json
          if-no-files-found: warn

  electron:
    name: Electron tests on ${{ matrix.os }} (${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies without running install scripts
        # See the same step in release.yml for why this is safe: the tree's only install script
        # belongs to electron-winstaller, which is Squirrel-only and lazily required, and neither
        # Electron's binary (fetched on first require) nor TypeScript's native compiler (platform
        # optionalDependencies) comes from an install script. The Electron smoke test in this job is
        # what proves it -- it launches a real Electron, so a missing binary would fail here.
        run: npm ci --ignore-scripts
      - name: Fetch Electron's binary
        # With install scripts off, Electron downloads its binary the first time it is required. The
        # test files run in parallel, so do it once here rather than in several of them at the same time.
        run: node -e "require('electron')"
      - name: Allow Electron's Linux sandbox to use unprivileged user namespaces
        # ubuntu-latest's AppArmor policy blocks unprivileged user-namespace creation, which is
        # exactly what Chromium's non-setuid sandbox falls back to (an npm-installed Electron never
        # gets its chrome-sandbox helper installed as a root-owned SUID binary, so it's always on this
        # path). This relaxes the runner VM's own kernel policy for the life of this ephemeral job —
        # it changes nothing about the app's shipped sandbox posture. Chromium's sandbox stays ENABLED
        # for the test run (this workflow never turns Electron's own sandbox off, by any means), so CI
        # exercises the same configuration a player runs, not a weakened one.
        # `|| true` on the write keeps a missing/renamed sysctl key on a future runner image from
        # failing the job outright — but that would leave the sandbox silently blocked with nothing in
        # the log to explain a red Linux leg, so the read-back below makes the outcome visible: a
        # GitHub Actions warning annotation when the relaxation did not actually take effect.
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          value="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'absent')"
          if [ "$value" = "0" ]; then
            echo "kernel.apparmor_restrict_unprivileged_userns=0 — unprivileged user namespaces allowed, Electron's sandbox can start"
          else
            echo "::warning::kernel.apparmor_restrict_unprivileged_userns is '$value', not 0 — this runner image may block Electron's sandbox from starting even with a display"
          fi
      - name: Test (Linux, virtual display for Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --only-electron --shard=${{ matrix.shard }}/2
      - name: Test
        if: runner.os != 'Linux'
        run: npm test -- --only-electron --shard=${{ matrix.shard }}/2
      - name: Upload the test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summary-electron-${{ matrix.os }}-${{ matrix.shard }}
          path: test_logs/latest_summary.json
          if-no-files-found: warn

  test:
    # The required checks keep their names. A needs: on a matrix job waits for every one of its legs, so each of these passes
    # only when all the Node and Electron jobs passed; the failing job itself is the one to open.
    name: Test on ${{ matrix.os }}
    needs: [node, electron]
    # !cancelled() rather than always(): it still runs when a job failed, but not for a run a newer push cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Every Node and Electron job passed
        run: |
          echo "node: ${{ needs.node.result }}, electron: ${{ needs.electron.result }}"
          test "${{ needs.node.result }}" = success && test "${{ needs.electron.result }}" = success
