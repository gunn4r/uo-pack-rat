# Dependabot keeps two things current that nothing else in this repository will notice going stale:
# the npm lockfile (which is fully pinned by design, so it never moves on its own) and the commit
# SHAs that .github/workflows/*.yml pin every action to (which are deliberately immutable, so they
# rot instead of drifting). This file only configures version updates -- Dependabot ALERTS and
# security updates are repository settings a maintainer has to switch on by hand, see RELEASING.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node release line the app targets (engines: >=24, CI on Node 24), not
      # the newest Node. A newer major's types would let code compile that does not run on Node 24.
      # Move this deliberately when the supported Node version moves. The ignore names the versions
      # rather than "semver-major" updates, because that form is relative to whatever is installed: it
      # kept a 24.x that was added by hand current instead of holding the line at the target major.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # One pull request a week for the routine devDependency churn, rather than five. Majors stay
      # separate and unbatched: electron and electron-builder majors change what ships to a player's
      # machine and each deserves its own review and its own three-platform CI run.
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
