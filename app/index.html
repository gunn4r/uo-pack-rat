<!doctype html>
<html lang="en" data-theme="default" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack Rat</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/components.css">
<link rel="stylesheet" href="/ui/styles.css">
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/inventory.css">
<link rel="stylesheet" href="/ui/characters.css">
<link rel="stylesheet" href="/ui/builder.css">
<link rel="stylesheet" href="/ui/settings.css">
<link rel="stylesheet" href="/ui/import.css">
<link rel="stylesheet" href="/ui/wizard.css">
<link rel="stylesheet" href="/ui/runs.css">
</head>
<body class="pr">
<!-- ============================================================ app shell (ui/shell.mts, ui/shell.css) -->
<div id="app" class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <div class="brand"><img src="/favicon.png" alt=""><span class="brand-name">Pack Rat</span></div>
    <a class="nav-item" href="#/inventory" data-nav="inventory"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg><span class="nav-label">Inventory</span><span class="count" id="nav-count-inventory"></span></a>
    <a class="nav-item" href="#/characters" data-nav="characters"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"></path></svg><span class="nav-label">Characters</span><span class="count" id="nav-count-characters"></span></a>
    <a class="nav-item" href="#/builder" data-nav="builder"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg><span class="nav-label">Suit Builder</span></a>
    <a class="nav-item nav-sub" href="#/runs" data-nav="runs"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="nav-label">Runs</span><span class="count" id="nav-count-runs"></span></a>
    <a class="nav-item" href="#/import" data-nav="import"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg><span class="nav-label">Import</span><kbd class="kbd" aria-hidden="true">⌘I</kbd></a>
    <a class="nav-item" href="#/settings" data-nav="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg><span class="nav-label">Settings</span></a>
    <div class="sidebar-foot">
      <p class="t-sm muted sidebar-meta"><span id="status">Loading…</span></p>
      <button class="bridge" id="bridge" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="dot" id="bridge-dot"></span><span class="ellip" id="bridge-label">Checking the bridge…</span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>
      <button class="nav-item sidebar-pin" id="sidebar-pin" type="button" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg><span class="nav-label">Collapse sidebar</span></button>
    </div>
  </nav>

  <div class="main">
    <div id="notice" class="msg warn" role="status" hidden></div>

    <!-- ========================================================== Inventory (ui/inventory.mts, ui/containers.mts, ui/inventory.css) -->
    <main class="screen" id="tab-inventory" aria-labelledby="h-inventory">
      <header class="topbar">
        <h1 id="h-inventory">Inventory</h1>
        <div class="seg" id="inv-view" role="radiogroup" aria-label="View">
          <button type="button" role="radio" data-view="items" aria-checked="true"><span>Items</span></button>
          <button type="button" role="radio" data-view="containers" aria-checked="false" tabindex="-1"><span>Containers</span></button>
        </div>
        <span class="spacer"></span>
        <a class="btn btn-sm" href="#/import" id="inv-import"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg><span>Import scans</span></a>
      </header>
      <div class="page">
        <div id="inv-view-items" class="inv-view">
          <div class="inv-toolbar" id="inv-toolbar" role="toolbar" aria-label="Filters" aria-controls="inv-table"></div>
          <div class="inv-active" id="inv-active" role="group" aria-label="Active filters" hidden></div>
          <div class="inv-body" id="inv-body">
            <section class="card inv-card" id="inv-card" aria-label="Items">
              <div class="inv-scroll" id="inv-scroll">
                <table class="tbl inv-tbl" id="inv-table" role="grid" aria-label="Items"><colgroup></colgroup><thead></thead><tbody></tbody></table>
                <div class="inv-state" id="inv-state" hidden></div>
              </div>
              <div class="inv-fade" id="inv-fade" aria-hidden="true" hidden></div>
              <div class="tbl-foot" id="inv-foot"></div>
            </section>
            <aside class="card peek" id="inv-peek" aria-label="Item detail" hidden></aside>
          </div>
        </div>
        <div id="tab-containers" class="inv-view" hidden>
          <section class="card inv-card" aria-label="Containers">
            <div class="inv-scroll"><table class="tbl" id="cont-table" aria-label="Scanned containers"><colgroup></colgroup><thead></thead><tbody></tbody></table></div>
            <div class="tbl-foot" id="cont-foot"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- ========================================================== Characters (ui/characters.mts, ui/characters.css) -->
    <main class="screen" id="tab-characters" aria-labelledby="h-characters" hidden>
      <header class="topbar"><h1 id="h-characters">Characters</h1></header>
      <div class="page" id="char-body"></div>
    </main>

    <!-- ========================================================== Suit Builder (ui/builder.mts, ui/runs.mts, ui/builder.css) -->
    <main class="screen" id="tab-builder" aria-labelledby="h-builder" hidden>
      <header class="topbar" id="b-topbar">
        <h1 id="h-builder">Suit Builder</h1>
        <label class="sr" for="b-char">Character</label>
        <select id="b-char" class="select input-sm b-topbar-char"></select>
        <span class="spacer"></span>
        <button class="btn btn-sm" type="button" id="b-runs-open"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Saved runs</span><span class="badge" id="b-runs-count">0</span></button>
      </header>
      <header class="topbar" id="b-cmp-topbar" hidden></header>
      <div class="page b-page">
        <aside class="card b-panel" id="b-panel" aria-label="Build settings">
          <button class="btn btn-ghost b-panel-toggle" type="button" id="b-panel-toggle" aria-expanded="true" aria-controls="b-panel-body"><span>Build settings</span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>
          <div class="b-panel-scroll" id="b-panel-body"></div>
          <footer class="overlay-foot b-panel-foot">
            <button class="btn btn-primary btn-lg" type="button" id="b-run"><span>Build best suit</span><kbd class="kbd" aria-hidden="true">⌘↵</kbd></button>
            <button class="btn btn-lg" type="button" id="b-save"><span>Save profile</span></button>
          </footer>
        </aside>
        <div class="b-results" id="b-results"><div id="b-msg"></div><div id="b-result"></div></div>
        <div class="b-compare-view" id="b-compare-view" hidden></div>
      </div>
    </main>

    <!-- ========================================================== Settings (ui/settings.mts, ui/settings.css) -->
    <main class="screen settings" id="tab-settings" data-panel="settings" aria-labelledby="h-settings" hidden>
      <header class="topbar"><h1 id="h-settings">Settings</h1></header>
      <div class="page settings-page">
        <nav class="set-nav" id="settings-nav" aria-label="Settings sections"></nav>
        <div class="set-content" id="settings-body"><div class="panel empty">loading…</div></div>
      </div>
    </main>
  </div>
</div>

<!-- ============================================================ overlays: outside #app, which goes inert while a drawer is open -->
<dialog id="wizard" class="dialog wizard"></dialog>
<div id="tip" class="tipcard-host" role="tooltip" data-theme="default" data-mode="dark"></div>

<!-- Import drawer (ui/import.mts, ui/import.css) -->
<div class="drawer-root" id="import-drawer" hidden inert>
  <div class="scrim" data-drawer-close></div>
  <aside class="drawer drawer-wide" role="dialog" aria-modal="true" aria-labelledby="import-drawer-title">
    <header class="overlay-head">
      <span class="overlay-titles"><h2 id="import-drawer-title">Import scans</h2><span class="t-sm muted">Add a scan your client could not write as a file</span></span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-icon" type="button" data-drawer-close aria-label="Close Import"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </header>
    <div class="drawer-body" id="import-body"><div class="panel empty">loading…</div></div>
    <footer class="overlay-foot" id="import-foot"></footer>
  </aside>
</div>

<!-- Saved runs drawer (ui/runs.mts, ui/runs.css) -->
<div class="drawer-root" id="runs-drawer" hidden inert>
  <div class="scrim" data-drawer-close></div>
  <aside class="drawer runs-drawer" role="dialog" aria-modal="true" aria-labelledby="runs-drawer-title">
    <header class="overlay-head">
      <span class="overlay-titles"><h2 id="runs-drawer-title">Saved runs</h2><span class="t-sm muted" id="b-runs-who"></span></span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-icon" type="button" id="b-runs-close" data-drawer-close aria-label="Close saved runs (Esc)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </header>
    <div class="runs-filter">
      <div class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><label class="sr" for="b-runs-filter">Filter runs</label><input id="b-runs-filter" class="input" type="search" placeholder="Filter by name or change, e.g. DI floor"></div>
    </div>
    <div class="drawer-body runs-body"><ul class="runs" id="b-runs" aria-label="Runs"></ul></div>
    <footer class="overlay-foot">
      <span class="t-sm muted" id="b-runs-sel" aria-live="polite"></span>
      <button class="btn btn-ghost btn-sm" type="button" id="b-runs-clear"><span>Clear</span></button>
      <span class="spacer"></span>
      <button class="btn btn-primary" type="button" id="b-runs-compare" disabled><span>Compare runs</span></button>
    </footer>
  </aside>
</div>

<script type="module" src="/ui/app.mjs"></script>
</body>
</html>
